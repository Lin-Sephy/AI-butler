<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据 · 你的专注印记</title>

<!--
  数据页设计稿 v2（2026-04-23 第三轮）
  ─────────────────────────────────────────
  · 环形图：居中 + 引线 callout 标注任务时长，中心字缩小，不要后缀说明
  · 专注时段：24h 维度（0-23 点），不是每日趋势，横向可拖动
  · 松林：feTurbulence 针叶质感版（v2 初版）+ 三层空间雾化
  · 全中文，不再混英文
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;700&display=swap');

  :root {
    --base-h: 222; --base-s: 57%; --base-l: 96%;
    --primary-h: 202; --primary-s: 45%; --primary-l: 52%;
    --accent-h: 198; --accent-s: 45%; --accent-l: 85%;
    --text-h: 240; --text-s: 3%; --text-l: 21%;

    --color-base: hsl(var(--base-h), var(--base-s), var(--base-l));
    --color-primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
    --color-primary-strong: hsl(var(--primary-h), 55%, 38%);
    --color-accent: hsl(var(--accent-h), var(--accent-s), var(--accent-l));
    --color-text: hsl(var(--text-h), var(--text-s), var(--text-l));
    --color-subtle: hsl(var(--text-h), var(--text-s), 45%);
    --color-muted: hsl(var(--text-h), var(--text-s), 62%);
    --color-line: hsl(var(--text-h), var(--text-s), 85%);
    --color-line-soft: hsl(var(--text-h), var(--text-s), 92%);
    --color-surface: #ffffff;
    --color-primary-soft: hsl(var(--primary-h), var(--primary-s), 93%);
    --color-accent-soft: hsl(var(--accent-h), var(--accent-s), 95%);
    --forest: #4896c4;

    --radius: 20px;
    --transition: 350ms cubic-bezier(0.22, 1, 0.36, 1);

    --font-serif: 'IBM Plex Serif', 'Noto Serif SC', Georgia, serif;
    --font-cn: 'Noto Serif SC', 'IBM Plex Serif', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  em, i, .italic { font-style: normal; }

  html, body {
    font-family: var(--font-cn);
    color: var(--color-text);
    font-weight: 400;
    line-height: 1.55;
    font-feature-settings: "kern" on, "liga" on;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 20% -10%, hsl(var(--primary-h), 45%, 94%) 0%, transparent 55%),
      radial-gradient(1000px 700px at 90% 120%, hsl(var(--accent-h), 45%, 92%) 0%, transparent 60%),
      var(--color-base);
    padding: 40px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }

  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .snow span {
    position: absolute; top: -20px;
    width: 4px; height: 4px; border-radius: 50%;
    background: hsl(var(--primary-h), 40%, 75%);
    opacity: 0.35;
    animation: snowfall linear infinite;
  }
  .snow span:nth-child(1) { left: 8%;  animation-duration: 22s; animation-delay: 0s;  width: 3px; height: 3px; }
  .snow span:nth-child(2) { left: 28%; animation-duration: 28s; animation-delay: 6s; }
  .snow span:nth-child(3) { left: 55%; animation-duration: 24s; animation-delay: 12s; width: 5px; height: 5px; opacity: 0.25; }
  .snow span:nth-child(4) { left: 78%; animation-duration: 30s; animation-delay: 3s; }
  .snow span:nth-child(5) { left: 92%; animation-duration: 26s; animation-delay: 14s; width: 3px; height: 3px; }
  @keyframes snowfall {
    0%   { transform: translateY(0) translateX(0); }
    50%  { transform: translateY(50vh) translateX(20px); }
    100% { transform: translateY(110vh) translateX(-10px); }
  }

  .page {
    max-width: 760px; margin: 0 auto; position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 28px;
  }

  .page-header {
    padding: 8px 8px 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
    animation: rise 800ms var(--transition) both;
  }
  .page-title {
    font-family: var(--font-cn);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--color-text);
  }
  .page-date {
    font-family: var(--font-serif);
    font-size: 12px;
    color: var(--color-muted);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--color-surface);
    border: 1.5px solid var(--color-line);
    border-radius: var(--radius);
    padding: 32px 32px 30px;
    position: relative;
    animation: rise 900ms var(--transition) both;
  }
  .card:nth-child(2) { animation-delay: 80ms; }
  .card:nth-child(3) { animation-delay: 160ms; }
  .card:nth-child(4) { animation-delay: 240ms; }
  .card:nth-child(5) { animation-delay: 320ms; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .section-num {
    font-family: var(--font-serif);
    font-size: 11px;
    font-weight: 500;
    color: var(--color-primary);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  .section-rule { width: 24px; height: 1px; background: var(--color-line); }
  .section-label {
    font-family: var(--font-cn);
    font-size: 14px;
    font-weight: 400;
    color: var(--color-text);
    letter-spacing: 0.04em;
  }
  .section-extra { margin-left: auto; }

  /* ════════════════════════════════════════════════════════════
     01 · 今日 HERO
     ════════════════════════════════════════════════════════════ */
  .hero {
    padding: 40px 36px 38px;
    background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-surface) 60%, hsl(var(--primary-h), 45%, 97%) 100%);
    overflow: hidden;
  }
  .hero-body {
    display: flex;
    justify-content: flex-start;
    align-items: end;
    gap: 56px;
    flex-wrap: wrap;
  }
  .hero-main { display: flex; flex-direction: column; }
  .hero-number {
    font-family: var(--font-serif);
    font-size: 88px;
    font-weight: 300;
    color: var(--color-text);
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums lining-nums;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .hero-number .unit-sm {
    font-size: 22px;
    color: var(--color-subtle);
    font-weight: 400;
    letter-spacing: 0.02em;
    margin-left: 2px;
  }

  .hero-side {
    display: flex;
    flex-direction: column;
    gap: 18px;
    text-align: left;
    border-left: 1px solid var(--color-line-soft);
    padding-left: 28px;
    min-width: 160px;
  }
  .hero-item-label {
    font-family: var(--font-cn);
    font-size: 11px;
    color: var(--color-muted);
    margin-bottom: 6px;
    letter-spacing: 0.06em;
  }
  .hero-item-value {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: var(--color-text);
    line-height: 1;
  }
  .hero-item-value .unit {
    font-family: var(--font-cn);
    font-size: 14px;
    color: var(--color-subtle);
    margin-left: 4px;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--color-surface);
    border: 1px solid var(--color-primary);
    color: var(--color-primary-strong);
    border-radius: 99px;
    padding: 6px 14px 6px 10px;
    font-family: var(--font-cn);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }
  .hero-tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-primary);
  }

  /* ════════════════════════════════════════════════════════════
     02 · 任务分布 · 环形图居中 + 引线标注
     ════════════════════════════════════════════════════════════ */
  .tabs {
    display: inline-flex;
    background: var(--color-accent-soft);
    border-radius: 99px;
    padding: 3px;
    gap: 2px;
  }
  .tab {
    font-family: var(--font-cn);
    font-size: 12px;
    color: var(--color-subtle);
    padding: 6px 14px;
    border-radius: 99px;
    border: none; background: transparent; cursor: pointer;
    transition: all var(--transition);
    font-weight: 400;
  }
  .tab.active {
    background: var(--color-surface);
    color: var(--color-text);
    box-shadow: 0 0 0 1px var(--color-accent);
  }
  .tab:hover:not(.active) { color: var(--color-text); }

  /* 环形图整块居中 */
  .donut-stage {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0 6px;
  }
  .donut-svg {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
  }
  .donut-seg {
    fill: none;
    stroke-linecap: butt;
    stroke-width: 18;
    transform-origin: center;
  }
  .donut-center-num {
    font-family: var(--font-serif);
    font-size: 10px;
    font-weight: 400;
    fill: var(--color-text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  /* 引线 */
  .leader-line {
    fill: none;
    stroke: hsl(240, 3%, 70%);
    stroke-width: 0.6;
  }
  .leader-dot {
    fill: var(--color-text);
  }
  .leader-name {
    font-family: var(--font-cn);
    font-size: 6px;
    fill: var(--color-text);
    font-weight: 400;
  }
  .leader-time {
    font-family: var(--font-serif);
    font-size: 5.4px;
    fill: var(--color-subtle);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  /* ════════════════════════════════════════════════════════════
     03 · 我的专注时段 · 24h 维度
     ════════════════════════════════════════════════════════════ */
  .bars-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding: 0 4px;
  }
  .bars-avg {
    font-family: var(--font-cn);
    font-size: 12px;
    color: var(--color-subtle);
  }
  .bars-avg .peak-time {
    font-family: var(--font-serif);
    color: var(--color-primary-strong);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    margin: 0 2px;
  }
  .bars-hint {
    font-family: var(--font-cn);
    font-size: 11px;
    color: var(--color-muted);
    letter-spacing: 0.08em;
  }

  /* 子标题（03 下的两块）*/
  .sub-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px;
    margin-bottom: 12px;
  }
  .sub-title {
    font-family: var(--font-cn);
    font-size: 13px;
    color: var(--color-text);
    letter-spacing: 0.04em;
  }
  .sub-title::before {
    content: '·';
    color: var(--color-primary);
    margin-right: 8px;
    font-weight: 500;
  }
  .sub-meta {
    font-family: var(--font-cn);
    font-size: 11px;
    color: var(--color-subtle);
  }
  .sub-meta .hl {
    font-family: var(--font-serif);
    color: var(--color-primary-strong);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    margin: 0 2px;
  }
  .sub-divider {
    height: 1px;
    background: var(--color-line-soft);
    margin: 18px 0 22px;
  }

  .bars-scroll {
    overflow-x: auto;
    overflow-y: visible;
    padding: 10px 0 18px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--color-line) transparent;
  }
  .bars-scroll::-webkit-scrollbar { height: 4px; }
  .bars-scroll::-webkit-scrollbar-thumb { background: var(--color-line); border-radius: 99px; }
  .bars-scroll::-webkit-scrollbar-track { background: transparent; }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 180px;
    padding: 0 8px;
    min-width: max-content;
    position: relative;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    scroll-snap-align: center;
    min-width: 24px;
  }
  .bar {
    width: 18px;
    background: var(--color-accent);
    border-radius: 3px 3px 1px 1px;
    position: relative;
    transition: all var(--transition);
    cursor: pointer;
    animation: grow 700ms var(--transition) backwards;
  }
  .bar.peak { background: var(--color-primary); }
  .bar.empty { background: var(--color-line-soft); height: 3px !important; }
  .bar:hover { filter: brightness(0.92); }
  .bar:hover .bar-tooltip { opacity: 1; transform: translate(-50%, -4px); }
  @keyframes grow { from { height: 0 !important; opacity: 0; } }

  .bar-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translate(-50%, 4px);
    background: var(--color-text);
    color: var(--color-surface);
    font-family: var(--font-serif);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 200ms var(--transition);
    font-variant-numeric: tabular-nums;
  }
  .bar-label {
    font-family: var(--font-serif);
    font-size: 10px;
    color: var(--color-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    visibility: hidden;
  }
  .bar-col.show-label .bar-label { visibility: visible; }
  .bar-col.peak .bar-label {
    visibility: visible;
    color: var(--color-primary-strong);
    font-weight: 500;
  }

  /* ════════════════════════════════════════════════════════════
     04 · 累计 · 松林（回到 feTurbulence 针叶版）
     ════════════════════════════════════════════════════════════ */
  .grove-card {
    padding: 32px 32px 0;
    overflow: hidden;
  }
  .grove-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px 10px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .grove-stat {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .grove-days {
    font-family: var(--font-serif);
    font-size: 56px;
    font-weight: 300;
    color: var(--color-text);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums lining-nums;
    line-height: 1;
  }
  .grove-days-unit {
    font-family: var(--font-cn);
    font-size: 18px;
    color: var(--color-subtle);
    font-weight: 400;
  }
  .grove-hours {
    font-family: var(--font-cn);
    font-size: 13px;
    color: var(--color-muted);
    letter-spacing: 0.04em;
    padding-bottom: 4px;
  }
  .grove-hours .num {
    font-family: var(--font-serif);
    color: var(--color-subtle);
    font-variant-numeric: tabular-nums;
    margin: 0 2px;
  }
  .grove-caption {
    font-family: var(--font-cn);
    font-size: 11px;
    color: var(--color-muted);
    letter-spacing: 0.08em;
    text-align: right;
    max-width: 220px;
  }

  .grove-svg-wrap {
    margin: 0 -32px;
    position: relative;
  }
  .grove-svg {
    display: block;
    width: 100%;
    height: 170px;
  }
  .tree {
    animation: tree-rise 1200ms var(--transition) backwards;
    transform-origin: 50% 100%;
  }
  @keyframes tree-rise {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to   { opacity: var(--tree-opacity, 1); transform: translateY(0) scale(1); }
  }

  /* ════════════════════════════════════════════════════════════
     响应式
     ════════════════════════════════════════════════════════════ */
  @media (max-width: 640px) {
    body { padding: 24px 14px 60px; }
    .card { padding: 24px 20px 22px; }
    .grove-card { padding: 24px 20px 0; }
    .grove-svg-wrap { margin: 0 -20px; }

    .hero { padding: 28px 22px 26px; }
    .hero-body { grid-template-columns: 1fr; gap: 20px; }
    .hero-side {
      border-left: none;
      border-top: 1px solid var(--color-line-soft);
      padding-left: 0;
      padding-top: 18px;
      text-align: left;
      flex-direction: row;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .hero-number { font-size: 64px; }
    .hero-number .unit-sm { font-size: 18px; }

    .grove-days { font-size: 44px; }
    .grove-svg { height: 140px; }
    .page-title { font-size: 24px; }
  }

  @media (max-width: 400px) {
    .hero-number { font-size: 52px; }
  }

  .tab:focus-visible, .bar:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="snow" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="page">

  <header class="page-header">
    <h1 class="page-title">你的专注印记</h1>
    <div class="page-date">2026 · 04 · 23</div>
  </header>

  <!-- ═══ 01 · 今日 ═══ -->
  <section class="card hero">
    <div class="section-head">
      <span class="section-num">01</span>
      <span class="section-rule"></span>
      <span class="section-label">今日</span>
    </div>
    <div class="hero-body">
      <div class="hero-main">
        <div class="hero-number">
          <span>2<span class="unit-sm">h</span></span>
          <span>15<span class="unit-sm">min</span></span>
        </div>
      </div>
      <div class="hero-side">
        <div>
          <div class="hero-item-label">今日任务</div>
          <div class="hero-item-value">3<span class="unit">个</span></div>
        </div>
        <div>
          <div class="hero-item-label">最常做的事</div>
          <div class="hero-tag">写论文</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ 02 · 任务分布 · 环形图居中 + 引线 ═══ -->
  <section class="card">
    <div class="section-head">
      <span class="section-num">02</span>
      <span class="section-rule"></span>
      <span class="section-label">任务分布</span>
      <div class="section-extra">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab">日</button>
          <button class="tab active" role="tab" aria-selected="true">周</button>
          <button class="tab" role="tab">月</button>
        </div>
      </div>
    </div>

    <div class="donut-stage">
      <!-- viewBox 240x160；环圆心 (120,80) r=38；引线拉出 5 段 -->
      <svg class="donut-svg" viewBox="0 0 240 160" aria-label="任务分布">
        <!-- ─ 环（rotate -90 让起点从 12 点开始）─ -->
        <g transform="rotate(-90 120 80)">
          <circle cx="120" cy="80" r="38" fill="none" stroke="var(--color-line-soft)" stroke-width="18"/>
          <!-- 5 段。周长 2π·38 ≈ 238.76。顺序按角度增大 -->
          <circle class="donut-seg" cx="120" cy="80" r="38" stroke="hsl(202, 55%, 42%)"
                  stroke-dasharray="107.44 238.76" stroke-dashoffset="0"/>
          <circle class="donut-seg" cx="120" cy="80" r="38" stroke="hsl(202, 45%, 58%)"
                  stroke-dasharray="47.75 238.76" stroke-dashoffset="-107.44"/>
          <circle class="donut-seg" cx="120" cy="80" r="38" stroke="hsl(198, 45%, 72%)"
                  stroke-dasharray="35.81 238.76" stroke-dashoffset="-155.19"/>
          <circle class="donut-seg" cx="120" cy="80" r="38" stroke="hsl(198, 45%, 82%)"
                  stroke-dasharray="23.88 238.76" stroke-dashoffset="-191.00"/>
          <circle class="donut-seg" cx="120" cy="80" r="38" stroke="hsl(220, 15%, 85%)"
                  stroke-dasharray="23.88 238.76" stroke-dashoffset="-214.88"/>
        </g>

        <!-- ─ 中心总时长（小字）─ -->
        <text class="donut-center-num" x="120" y="82" text-anchor="middle">8h 40m</text>

        <!-- ─ 引线 + label · 5 段 ─
             各段中点角度（从 12 点顺时针）：
             写论文 81° / 健身 198° / 阅读 261° / 整理 306° / 其他 342°
             起点 r=50（环外边缘 + 一点间距）
        -->

        <!-- 写论文 · 右 -->
        <polyline class="leader-line" points="169,72 186,72 206,72"/>
        <circle class="leader-dot" cx="169" cy="72" r="1"/>
        <text class="leader-name" x="209" y="70">写论文</text>
        <text class="leader-time" x="209" y="78">3h 55m</text>

        <!-- 健身 · 下 -->

  <!-- ═══ 03 · 我的专注时段 · 24h ═══ -->
  <section class="card">

  <!-- ═══ 04 · 累计 · 松林 ═══ -->
  <section class="card grove-card">
    <div class="section-head">

    <div class="grove-meta">
      <div class="grove-stat">
        <div class="grove-days">12<span class="grove-days-unit"> 天</span></div>
        <div class="grove-hours">已陪伴你 <span class="num">48</span> 小时</div>
      </div>
      <div class="grove-caption">每一天的专注，都让林子长出一棵</div>
    </div>

    <div class="grove-svg-wrap">
      <svg class="grove-svg" viewBox="0 0 760 170" preserveAspectRatio="xMidYMax slice" aria-label="松林">
        <defs>
          <!-- feTurbulence + feDisplacementMap 把简单三角的边扰动成针叶轮廓 -->
          <filter id="needle-front" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
            <feDisplacementMap in="SourceGraphic" scale="2.5"/>
          </filter>
          <filter id="needle-mid" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/>
            <feDisplacementMap in="SourceGraphic" scale="1.8"/>
          </filter>
          <filter id="needle-back" x="-5%" y="-5%" width="110%" height="110%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>

          <linearGradient id="snowGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="hsl(222, 57%, 98%)"/>
            <stop offset="100%" stop-color="hsl(222, 57%, 94%)"/>
          </linearGradient>
          <linearGradient id="mistGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="hsl(222, 40%, 92%)" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="hsl(222, 40%, 96%)" stop-opacity="0"/>
          </linearGradient>

          <symbol id="pine" viewBox="0 0 40 120">
            <path d="M 20 5 L 28 30 L 12 30 Z" fill="currentColor"/>
            <path d="M 20 25 L 30 50 L 10 50 Z" fill="currentColor"/>
            <path d="M 20 45 L 33 72 L 7 72 Z" fill="currentColor"/>
            <path d="M 20 65 L 36 95 L 4 95 Z" fill="currentColor"/>
            <rect x="17.5" y="92" width="5" height="14" fill="#7a6957"/>
          </symbol>
          <symbol id="pine-mid" viewBox="0 0 40 120">
            <path d="M 20 10 L 27 35 L 13 35 Z" fill="currentColor"/>
            <path d="M 20 30 L 30 58 L 10 58 Z" fill="currentColor"/>
            <path d="M 20 52 L 34 85 L 6 85 Z" fill="currentColor"/>
            <rect x="17.5" y="82" width="5" height="12" fill="#7a6957"/>
          </symbol>
          <symbol id="pine-far" viewBox="0 0 40 120">
            <path d="M 20 20 L 26 45 L 14 45 Z" fill="currentColor"/>
            <path d="M 20 40 L 30 72 L 10 72 Z" fill="currentColor"/>
            <rect x="18" y="70" width="4" height="10" fill="#7a6957"/>
          </symbol>
          <symbol id="pine-placeholder" viewBox="0 0 40 120">
            <path d="M 20 25 L 30 58 L 10 58 Z"
                  fill="none" stroke="hsl(240, 3%, 82%)" stroke-width="1"
                  stroke-dasharray="2 3"/>
            <path d="M 20 50 L 34 85 L 6 85 Z"
                  fill="none" stroke="hsl(240, 3%, 82%)" stroke-width="1"
                  stroke-dasharray="2 3"/>
          </symbol>
        </defs>

        <rect x="0" y="0" width="760" height="140" fill="url(#mistGradient)"/>

        <!-- 远景雾化层 -->
        <g filter="url(#needle-back)" opacity="0.55">
          <use href="#pine-far" x="40"  y="56" width="40" height="120" color="hsl(202, 35%, 70%)"/>
          <use href="#pine-far" x="90"  y="48" width="40" height="120" color="hsl(202, 35%, 68%)"/>
          <use href="#pine-far" x="170" y="52" width="40" height="120" color="hsl(202, 35%, 72%)"/>
          <use href="#pine-far" x="250" y="50" width="40" height="120" color="hsl(202, 35%, 70%)"/>
          <use href="#pine-far" x="340" y="54" width="40" height="120" color="hsl(202, 35%, 72%)"/>
          <use href="#pine-far" x="440" y="48" width="40" height="120" color="hsl(202, 35%, 68%)"/>
          <use href="#pine-far" x="540" y="52" width="40" height="120" color="hsl(202, 35%, 70%)"/>
          <use href="#pine-far" x="620" y="50" width="40" height="120" color="hsl(202, 35%, 72%)"/>
          <use href="#pine-far" x="700" y="54" width="40" height="120" color="hsl(202, 35%, 70%)"/>
        </g>

        <!-- 中景层 -->
        <g filter="url(#needle-mid)">
          <g class="tree" id="tree-5" style="--tree-opacity: 0.78; animation-delay: 300ms;">
            <use href="#pine-mid" x="70"  y="30" width="44" height="120" color="#4896c4"/>
          </g>
          <g class="tree" id="tree-6" style="--tree-opacity: 0.72; animation-delay: 380ms;">
            <use href="#pine-mid" x="220" y="22" width="48" height="132" color="#4896c4"/>
          </g>
          <g class="tree" id="tree-7" style="--tree-opacity: 0.75; animation-delay: 460ms;">
            <use href="#pine-mid" x="380" y="28" width="44" height="124" color="#4896c4"/>
          </g>
          <g class="tree" id="tree-8" style="--tree-opacity: 0.72; animation-delay: 540ms;">
            <use href="#pine-mid" x="500" y="22" width="48" height="130" color="#4896c4"/>
          </g>
        </g>

        <!-- 前景层 · needle-front 最清晰 -->
        <g filter="url(#needle-front)">
          <g class="tree" id="tree-1" style="--tree-opacity: 1; animation-delay: 80ms;">
            <use href="#pine" x="30" y="18" width="52" height="138" color="#3d7ca3"/>
          </g>
          <g class="tree" id="tree-2" style="--tree-opacity: 1; animation-delay: 140ms;">
            <use href="#pine" x="150" y="8"  width="56" height="150" color="#4896c4"/>
          </g>
          <g class="tree" id="tree-3" style="--tree-opacity: 1; animation-delay: 200ms;">
            <use href="#pine" x="300" y="12" width="52" height="144" color="#3d7ca3"/>

            <use href="#pine" x="600" y="14" width="54" height="144" color="#4896c4"/>

          <g class="tree" id="tree-10" style="--tree-opacity: 0.92; animation-delay: 660ms;">
            <use href="#pine" x="700" y="18" width="50" height="138" color="#3d7ca3"/>

        </g>

        <!-- 占位（未种） -->
        <g class="tree-placeholder" opacity="0.65">
          <use href="#pine-placeholder" x="106" y="50" width="38" height="110"/>
          <use href="#pine-placeholder" x="276" y="50" width="36" height="108"/>
          <use href="#pine-placeholder" x="410" y="50" width="38" height="110"/>
          <use href="#pine-placeholder" x="560" y="50" width="36" height="108"/>
        </g>

        <!-- 雪地 -->
        <path d="M 0 140
                 C 70 132, 140 148, 210 138
                 C 280 130, 340 146, 410 138
                 C 480 132, 540 150, 620 140
                 C 680 134, 720 146, 760 140
                 L 760 170 L 0 170 Z"
              fill="url(#snowGradient)"/>

                 C 70 132, 140 148, 210 138
                 C 280 130, 340 146, 410 138

        <g opacity="0.8" fill="hsl(222, 57%, 98%)">

        <g fill="#4896c4" opacity="0.25">

</div>

<script>
  // ════════════════════════════════════════════════════════════
  // 柱状图通用渲染器
  // ════════════════════════════════════════════════════════════
  function renderBars(containerId, data, opts) {
    const bars = document.getElementById(containerId);
    const max = Math.max(...data.map(d => d.min));
    const maxH = 150;
    const peak = data.reduce((p, c) => c.min > p.min ? c : p, data[0]);

    data.forEach((d, i) => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      if (opts.markPeak && d === peak) col.classList.add('peak');
      if (opts.markToday && d.today) col.classList.add('peak');
      if (opts.showLabel(d, i)) col.classList.add('show-label');

      const bar = document.createElement('div');
      const h = d.min === 0 ? 0 : Math.max(8, (d.min / max) * maxH);
      const isPeakCol = (opts.markPeak && d === peak) || (opts.markToday && d.today);
      bar.className = 'bar' + (isPeakCol ? ' peak' : '') + (d.min === 0 ? ' empty' : '');
      bar.style.height = h + 'px';
      bar.style.animationDelay = (i * 20) + 'ms';

      const tip = document.createElement('div');
      tip.className = 'bar-tooltip';
      tip.textContent = opts.tooltip(d);
      bar.appendChild(tip);

      const label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = opts.label(d);

      col.appendChild(bar);
      col.appendChild(label);
      bars.appendChild(col);
    });

    return peak;
  }

  // ───── 24 小时分布 ─────
  const HOURS = [
    { h: 0,  min: 0   }, { h: 1,  min: 0   }, { h: 2,  min: 0   }, { h: 3,  min: 0 },
    { h: 4,  min: 0   }, { h: 5,  min: 0   }, { h: 6,  min: 15  }, { h: 7,  min: 40 },
    { h: 8,  min: 65  }, { h: 9,  min: 110 }, { h: 10, min: 145 }, { h: 11, min: 120 },
    { h: 12, min: 50  }, { h: 13, min: 30  }, { h: 14, min: 90  }, { h: 15, min: 175 },
    { h: 16, min: 160 }, { h: 17, min: 105 }, { h: 18, min: 55  }, { h: 19, min: 40  },
    { h: 20, min: 95  }, { h: 21, min: 120 }, { h: 22, min: 85  }, { h: 23, min: 35  },
  ];
  const peakHour = renderBars('bars-24h', HOURS, {
    markPeak: true,
    showLabel: (d) => d.h % 6 === 0,
    label: (d) => String(d.h).padStart(2, '0'),
    tooltip: (d) => {
      const t = String(d.h).padStart(2, '0') + ':00';
      return d.min === 0 ? (t + ' · 无') : (t + ' · ' + d.min + ' min');
    },
  });
  document.getElementById('peakTime').textContent =
    String(peakHour.h).padStart(2, '0') + ':00-' + String(peakHour.h + 1).padStart(2, '0') + ':00';

  // ───── 本月 30 天趋势 ─────
  // mock：04/01 到 04/30；今天是 04/23（索引 22）
  const MONTH_MINS = [
    45, 75, 0, 30, 90, 120, 60, 25, 0, 105,
    85, 50, 145, 95, 70, 0, 115, 80, 40, 60,
    155, 110, 135, 0, 0, 0, 0, 0, 0, 0
  ];
  const TODAY_IDX = 22;
  const MONTH = MONTH_MINS.map((min, i) => ({
    day: i + 1,
    min: min,
    today: i === TODAY_IDX,
    future: i > TODAY_IDX,
  }));
  renderBars('bars-30d', MONTH, {
    markToday: true,
    showLabel: (d) => (d.day - 1) % 5 === 0 || d.today,
    label: (d) => String(d.day).padStart(2, '0'),
    tooltip: (d) => {
      const t = '04/' + String(d.day).padStart(2, '0');
      if (d.future) return t + ' · 还没到';
      return d.min === 0 ? (t + ' · 休息') : (t + ' · ' + d.min + ' min');
    },
  });

  // 默认滚动 · 24h 到白天 / 30d 到今天
  requestAnimationFrame(() => {
    const scrolls = document.querySelectorAll('.bars-scroll');
    if (scrolls[0]) scrolls[0].scrollLeft = scrolls[0].scrollWidth * 0.25;
    if (scrolls[1]) scrolls[1].scrollLeft = scrolls[1].scrollWidth;
  });

  document.querySelectorAll('.tabs').forEach(group => {
    group.addEventListener('click', e => {
      if (!e.target.classList.contains('tab')) return;
      group.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        t.removeAttribute('aria-selected');
      });
      e.target.classList.add('active');
      e.target.setAttribute('aria-selected', 'true');
    });
  });
</script>

</body>
